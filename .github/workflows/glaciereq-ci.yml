name: GlacierEQ downstream validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"
      - "sync/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: glaciereq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Install DotSlash
        run: |
          cargo install dotslash --locked
          /usr/bin/env dotslash --help

      - name: Run strict shared validation
        run: bash scripts/glaciereq-validate.sh
