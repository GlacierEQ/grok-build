name: Sync upstream Grok Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"

permissions: {}

concurrency:
  group: grok-build-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    outputs:
      needs_sync: ${{ steps.prepare.outputs.needs_sync }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
      branch: ${{ steps.prepare.outputs.branch }}

    steps:
      - name: Check out GlacierEQ main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare mirror and review branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GlacierEQ Upstream Sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/xai-org/grok-build.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xai-org/grok-build.git
          git fetch origin main
          git fetch upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          short_sha="${upstream_sha:0:12}"
          branch="sync/upstream-$short_sha"

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git push origin "$upstream_sha:refs/heads/upstream/main"

          if git merge-base --is-ancestor "$upstream_sha" origin/main; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git switch -C "$branch" "origin/$branch"
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              title="Upstream sync conflict: $short_sha"
              existing_issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
              if [ -z "$existing_issue" ]; then
                gh issue create --title "$title" --body "The existing sync branch conflicts with the latest GlacierEQ main. Resolve while preserving intentional downstream changes."
              fi
              exit 1
            fi
          else
            git switch -c "$branch" origin/main
          fi

          if ! git merge --no-edit "$upstream_sha"; then
            git merge --abort || true
            title="Upstream sync conflict: $short_sha"
            existing_issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
            if [ -z "$existing_issue" ]; then
              gh issue create --title "$title" --body "The upstream commit $upstream_sha conflicts with GlacierEQ main. Resolve while preserving intentional downstream changes."
            fi
            exit 1
          fi

          git push --set-upstream origin "$branch"

  validate:
    needs: prepare
    if: needs.prepare.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out prepared merge without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Install DotSlash
        run: |
          cargo install dotslash --locked
          /usr/bin/env dotslash --help

      - name: Run full strict shared validation
        run: bash scripts/glaciereq-validate.sh

  publish:
    needs:
      - prepare
      - validate
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Open or refresh upstream sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          VALIDATION: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Upstream: xai-org/grok-build at $UPSTREAM_SHA
          Mirror: upstream/main
          Merge branch: $BRANCH
          Full shared validation: $VALIDATION

          The sync branch includes the latest GlacierEQ main and was validated without repository write credentials."

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            if [ "$VALIDATION" = "success" ]; then
              gh pr ready "$existing" --repo "$GITHUB_REPOSITORY" || true
            else
              gh pr ready "$existing" --repo "$GITHUB_REPOSITORY" --undo || true
            fi
          elif [ "$VALIDATION" = "success" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "chore: sync Grok Build upstream $SHORT_SHA" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" --title "chore: sync Grok Build upstream $SHORT_SHA" --body "$body"
          fi
